<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas</title>

    <style>
        #myDrawing{
            border:solid 1px darkgreen;
        }

        body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background-color: black;
        }
    </style>

</head>
<body>
    <a href="index.html">Home</a>
    <h1 style="color: red;">Merry Christmas!</h1>
    
    <canvas height ="500" width="1000" id="myDrawing"> </canvas>

    <script>
        const canvas = document.getElementById("myDrawing");
        const ctx = canvas.getContext("2d");
        //head
        ctx.beginPath();
        ctx.moveTo(500, 50);
        ctx.lineTo(400, 200);
        ctx.lineTo(600, 200);
        ctx.lineTo(500, 50);
        
        ctx.fillStyle = '#03CC28'; 
        ctx.fill(); 
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3;
        ctx.stroke();

        //shoulder
        ctx.beginPath();
        ctx.moveTo(550, 200);
        ctx.lineTo(600, 300);
        ctx.lineTo(400, 300);
        ctx.lineTo(450, 200);
        
        ctx.fillStyle = '#03CC28'; 
        ctx.fill(); 
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3;
        ctx.stroke();

        //toes haha
        ctx.beginPath();
        ctx.moveTo(460, 300);
        ctx.lineTo(460, 350);
        ctx.lineTo(500, 350);
        ctx.lineTo(550, 350);
        ctx.lineTo(550, 300);
        
        ctx.fillStyle = '#665124'; 
        ctx.fill(); 
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3;
        ctx.stroke();
    </script>


</body>
</html>
