<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas</title>

    <style>
        #myDrawing{
            border:solid 1px darkgreen;
        }

        body {
        margin: 0;
        height: 50vh;
        display: grid;
        place-items: center;
        background-color: rgb(0, 0, 0);
        }
    </style>

</head>
<body>
    <a href="index.html">Home</a>
    <h1 style="color: red;">Merry Christmas!</h1>
    
    <canvas height ="500" width="1000" id="myDrawing"> </canvas>

    

    <script>
        

        const canvas = document.getElementById("myDrawing");
        const ctx = canvas.getContext("2d");
        
        ctx.beginPath();
        ctx.moveTo(100, 100);
        ctx.lineTo(130, 50);
        ctx.lineTo(160, 100);
        ctx.lineTo(210, 120);
        ctx.lineTo(160, 150);
        ctx.lineTo(140, 190);
        ctx.lineTo(110, 150);
        ctx.lineTo(60, 120);
        ctx.lineTo(100, 98);

        ctx.fillStyle = '#E2C308'; 
        ctx.fill(); 
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3;
        ctx.stroke();


        //head
        ctx.beginPath();
        ctx.moveTo(500, 50);
        ctx.lineTo(400, 200);
        ctx.lineTo(600, 200);
        ctx.lineTo(500, 50);
        
        ctx.fillStyle = '#03CC28'; 
        ctx.fill(); 
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3;
        ctx.stroke();

        //shoulder
        ctx.beginPath();
        ctx.moveTo(550, 200);
        ctx.lineTo(600, 300);
        ctx.lineTo(400, 300);
        ctx.lineTo(450, 200);
        
        ctx.fillStyle = '#03CC28'; 
        ctx.fill(); 
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3;
        ctx.stroke();

        //toes haha
        ctx.beginPath();
        ctx.moveTo(460, 300);
        ctx.lineTo(460, 350);
        ctx.lineTo(500, 350);
        ctx.lineTo(550, 350);
        ctx.lineTo(550, 300);
        
        ctx.fillStyle = '#665124'; 
        ctx.fill(); 
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3;
        ctx.stroke();

        function draw20BlueCircles() {
            for (let i = 0; i < 20; i++) {
                // 1. Random X and Y position on the canvas
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                // 2. Random size (radius from 5px to 30px)
                const radius = Math.random() * 5 + 1;
                // 3. Random shade of blue
                const hue = Math.floor(Math.random() * 360);
                const lightness = Math.floor(Math.random() * 50) + 35;
                ctx.fillStyle = "hsl(" + hue + ", 85%, " + lightness + "%)";
                // 4. Draw the circle
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
            }//end of for loop
        }//end fo function
        draw20BlueCircles();

        ctx.font = "50px Monotype Corsiva";
        ctx.fillStyle = "red";
        ctx.fillText("MERYY NEW YEAR!!!" ,310, 420); 

    </script>

</body>
</html>
