      <h1>
        My Photo Gallery (This is currently a draft and is currently in
        progress.)
      </h1>
      <div class="carousel" id="carousel">
        <div class="slides">
          <figure class="slide">
            <img src="images/futureMe.jpg" alt="Describe image 1" />
            <figcaption>Future Me</figcaption>
          </figure>
          <figure class="slide">
            <img src="images/me.jpg" alt="Describe image 1" />
            <figcaption>Me</figcaption>
          </figure>
          <figure class="slide">
            <img src="images/fam.jpg" alt="Describe image 1" />
            <figcaption>My fam</figcaption>
          </figure>
          <figure class="slide">
            <img src="images/hobby2.jpg" alt="Describe image 2" />
            <figcaption>My hobbies</figcaption>
          </figure>
          <figure class="slide">
            <img src="images/hobby1.jpg" alt="Describe image 3" />
            <figcaption>My hobbies</figcaption>
          </figure>
          <figure class="slide">
            <img src="images/homies3.jpg" alt="Describe image 3" />
            <figcaption>My Homies</figcaption>
          </figure>
          <figure class="slide">
            <img src="images/homies1.jpg" alt="Describe image 3" />
            <figcaption>My Homies</figcaption>
          </figure>
          <figure class="slide">
            <img src="images/homiesz.jpg" alt="Describe image 3" />
            <figcaption>My Homies</figcaption>
          </figure>

          <button
            class="aside prev"
            type="button"
            aria-label="Previous slide"
          >
            &#10094;
          </button>

          <button class="aside next" type="button" aria-label="Next slide">
            &#10095;
          </button>
        </div>
        <div class="dots"></div>
      </div>

      <footer>
        <p>&copy; 2026 Luscian Corp | Facebook: @ecnirPPPPP</p>
      </footer>

      <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
      <script>
        $(document).ready(function () {
          // 1. Cache elements and settings
          const $carousel = $("#carousel");
          const $slides = $carousel.find(".slide");
          const $dotsBox = $carousel.find(".dots");
          const total = $slides.length;
          const FADE_TIME = 500; // milliseconds
          const DELAY = 5000; // time between automatic slides
          let current = 0; // index of the visible slide
          let timer = null; // holds the autoplay timer
          // 2. Initial state: show only the first slide
          $slides.hide().eq(0).show();
          // 3. Create one dot per slide
          $slides.each(function (i) {
            $("<button>")
              .attr({ type: "button", "aria-label": "Go to slide " + (i + 1) })
              .addClass("dot" + (i === 0 ? " active" : ""))
              .data("index", i)
              .appendTo($dotsBox);
          });
          const $dots = $dotsBox.find(".dot");
          // 4. Show a specific slide
          function showSlide(index) {
            if (index === current) return; // nothing to do
            $slides.eq(current).stop(true, true).fadeOut(FADE_TIME);
            $slides.eq(index).stop(true, true).fadeIn(FADE_TIME);
            $dots.removeClass("active").eq(index).addClass("active");
            current = index;
          }
          function nextSlide() {
            showSlide((current + 1) % total);
          }
          function prevSlide() {
            showSlide((current - 1 + total) % total);
          }
          // 5. Controls
          $carousel.on("click", ".next", nextSlide);
          $carousel.on("click", ".prev", prevSlide);
          $dotsBox.on("click", ".dot", function () {
            showSlide($(this).data("index"));
          });
          // 6. Autoplay (pauses on hover)
          function startAutoplay() {
            stopAutoplay(); // avoid duplicate timers
            timer = setInterval(nextSlide, DELAY);
          }
          function stopAutoplay() {
            clearInterval(timer);
          }
          $carousel
            .on("mouseenter", stopAutoplay)
            .on("mouseleave", startAutoplay);
          startAutoplay();
          // 7. Keyboard control
          $(document).on("keydown", function (event) {
            if (event.key === "ArrowRight") {
              nextSlide();
            } else if (event.key === "ArrowLeft") {
              prevSlide();
            }
          });
        });
      </script>
    </body>
