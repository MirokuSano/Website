<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Save Grades</h1>
    <label>LRN</label>
    <input type="text" id="lrn" name="lrn" maxlength="11" required>

    <label>Name</label>
    <input type="text" id="name" name="name" required>

    <label>Subject</label>
    <input type="text" id="subject" name="subject" required>

    <label>Grade</label>
    <input type="number" id="grade" name="grade" min="0" max="100" required>
    <input type="button" id="saveButton" value ="Save">
    
    <p id="message"></p>
    <br>
    <table border="1">
        <thead>
            <tr>
                <th>LRN</th>
                <th>Name</th>
                <th>Subject</th>
                <th>Grade</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="table-body">
        </tbody>
    </table>

    <script>
        var lrnInput = document.getElementById('lrn');
        var nameInput = document.getElementById('name');
        var subjectInput = document.getElementById('subject');
        var gradeInput = document.getElementById('grade');
        var saveButton = document.getElementById('saveButton');
        var message = document.getElementById('message');
        var tableBody = document.getElementById('table-body');

        var grades = JSON.parse(localStorage.getItem('grades')) || [];

        var selectedIndex = -1;

        function showGrades() {
            tableBody.textContent = "";
            for (var i = 0; i < grades.length; i++) {
                var row = tableBody.insertRow();
                row.insertCell().textContent = grades[i].lrn;
                row.insertCell().textContent = grades[i].name;
                row.insertCell().textContent = grades[i].subject;
                row.insertCell().textContent = grades[i].grade;

                var actionCell = row.insertCell();

                actionCell.appendChild(makeUpdateButton(i));
                actionCell.appendChild(makeDeleteButton(i));
            }
        }

        function makeUpdateButton(index) {
            var button = document.createElement('button');

            button.textContent = "Update";

            button.addEventListener('click', function() {
                loadForUpdate(index);
            });
            return button;
        }

        function makeDeleteButton(index) {
            var deleteButton = document.createElement('button');
            deleteButton.textContent = "Delete";

            deleteButton.addEventListener('click', function() {
                deleteGrade(index);
            });
            return deleteButton;
        }

        function loadForUpdate(index) {
            selectedIndex = index;

            lrnInput.value = grades[index].lrn;
            nameInput.value = grades[index].name;
            subjectInput.value = grades[index].subject;
            gradeInput.value = grades[index].grade;

            saveButton.value = "Update";
            message.textContent = "Change the values, then click to the update button above the table.";
        }

        function deleteGrade(index) {
            var sure = confirm("Delete the record of " + grades[index].name + "?");
            if(!sure){
                return;
            }

            grades.splice(index, 1);

            if (selectedIndex === index) {
                selectedIndex = -1;
                saveButton.value = "Save";
                lrnInput.value = "";
                nameInput.value = "";
                subjectInput.value = "";
                gradeInput.value = "";
            } else if (selectedIndex > index) {
                selectedIndex = selectedIndex - 1;
            }

            localStorage.setItem('grades', JSON.stringify(grades));
            message.textContent = "Deleted.";
            showGrades();
        }

        function saveGrade() {
            var lrn = lrnInput.value.trim();
            var name = nameInput.value.trim();
            var subject = subjectInput.value.trim();
            var grade = gradeInput.value.trim();

            if (lrn === "" || name === "" || subject === "" || grade === "") {
                alert("Please fill in all the boxes.");
                return;
            }

            var record = {
                lrn: lrn,
                name: name,
                subject: subject,
                grade: grade
            };

            if (selectedIndex === -1) {
                grades.push(record);
                message.textContent = "Grade saved successfully!";
            } else {
                grades[selectedIndex] = record;
                message.textContent = "Grade updated successfully!";
                selectedIndex = -1;
                saveButton.value = "Save";
            }

            localStorage.setItem('grades', JSON.stringify(grades));

            lrnInput.value = "";
            nameInput.value = "";
            subjectInput.value = "";
            gradeInput.value = "";
            showGrades();
        }

        saveButton.addEventListener('click', saveGrade);
        showGrades();
    </script>
</body>

</html>
